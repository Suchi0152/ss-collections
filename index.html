<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SS Collections</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

.topbar{
background:black;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
padding-left:30px;
padding-right:30px;
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:white;
position:sticky;
top:0;
}

.logo{
font-size:30px;
font-style:italic;
font-weight:bold;
}

.nav-links a{
margin:15px;
text-decoration:none;
color:black;
font-weight:bold;
cursor:pointer;
}

.nav-links a:hover{
color:red;
}

.hero{
height:400px;
background:url("./image1.jpeg");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
text-shadow:2px 2px 5px black;
}

.hero h1{
font-size:50px;
}

.hero button{
padding:15px 30px;
margin-top:20px;
border:none;
background:red;
color:white;
font-size:18px;
border-radius:5px;
cursor:pointer;
}

.section-title{
text-align:center;
margin:40px;
font-size:30px;
}

.container{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;
padding:30px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.content{
padding:15px;
text-align:center;
}

.price{
color:red;
font-size:20px;
font-weight:bold;
}

.old{
text-decoration:line-through;
color:gray;
font-size:14px;
}

.buttons{
display:flex;
justify-content:center;
gap:10px;
margin-top:15px;
}

button{
padding:10px;
border:none;
border-radius:5px;
cursor:pointer;
}

.wishlist{
background:orange;
color:white;
}

.book{
background:green;
color:white;
}

.footer{
background:black;
color:white;
padding:40px;
margin-top:50px;
text-align:center;
}

.footer p{
margin:10px;
}

@media(max-width:992px){
.container{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:600px){
.container{
grid-template-columns:1fr;
}
.navbar{
flex-direction:column;
}
.nav-links{
margin-top:15px;
}
.hero h1{
font-size:30px;
}
}

/* WhatsApp Button */
.whatsapp-float{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
background:#25D366;
color:white;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
text-decoration:none;
z-index:1000;
}

.whatsapp-float:hover{
transform:scale(1.1);
transition:0.2s;
}

/* ✅ ONLY CHANGE ADDED HERE */
.hero h1,
.hero p{
color:black;
text-shadow:none;
}

</style>
</head>

<body>

<div class="topbar">
<div>SS Collections</div>
</div>

<div class="navbar">

<div class="logo">SS Collections</div>

<div class="nav-links">

<a onclick="filterProducts('all')">Home</a>
<a onclick="filterProducts('summer')">Summer</a>
<a onclick="filterProducts('trending')">Trending</a>
<a onclick="filterProducts('premium')">Premium</a>
<a onclick="filterProducts('sales')">Sales</a>
<a onclick="showWishlist()">Wishlist ❤️</a>

</div>

</div>

<div class="hero">

<h1>Summer Collection 2026</h1>
<p>Latest Sarees Collection</p>

<button onclick="window.open('https://chat.whatsapp.com/Jq9qwYF856h8UfzyOVn5KX','_blank')">
Shop Now
</button>

</div>

<h2 class="section-title">Trending Products</h2>

<div class="container" id="products">

<!-- cards remain same (no changes) -->

</div>

<div class="footer">

<h2>SS Collections</h2>
<p>IF YOU WANT TO ORDER PRESS WHATSAPP BUTTON</p>
<p>Free shipping above ₹4000</p>
<p>© 2026 SS Collections</p>

</div>

<a class="whatsapp-float"
   href="https://chat.whatsapp.com/Jq9qwYF856h8UfzyOVn5KX"
   target="_blank">
   💬
</a>

<script>

function filterProducts(type){

document.getElementById("wishlistTitle").style.display="none";
document.getElementById("wishlistContainer").style.display="none";

let cards=document.querySelectorAll("#products .card");

cards.forEach(function(card){

let price=parseInt(card.dataset.price);
let sale=card.dataset.sale;

card.style.display="none";

if(type=="all"){
card.style.display="block";
}
else if(type=="summer" && price<1000){
card.style.display="block";
}
else if(type=="trending" && price<1500){
card.style.display="block";
}
else if(type=="premium" && price>1500){
card.style.display="block";
}
else if(type=="sales" && sale=="yes"){
card.style.display="block";
}

});

}

function addWishlist(button){

let card=button.closest(".card");
let copy=card.cloneNode(true);

copy.querySelector(".wishlist").remove();

document.getElementById("wishlistContainer").appendChild(copy);

alert("Added to Wishlist");

}

function showWishlist(){

let cards=document.querySelectorAll("#products .card");

cards.forEach(function(card){
card.style.display="none";
});

document.getElementById("wishlistTitle").style.display="block";
document.getElementById("wishlistContainer").style.display="grid";

}

function buyNow(){
    window.open(
        "https://chat.whatsapp.com/Jq9qwYF856h8UfzyOVn5KX",
        "_blank"
    );
}

</script>

</body>
</html>
